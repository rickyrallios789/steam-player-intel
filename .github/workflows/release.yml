name: Release

# Runs when you either:
#   - push a version tag like v0.1.1, or
#   - click "Run workflow" on the Actions tab (workflow_dispatch).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Lets the built-in GITHUB_TOKEN create the GitHub Release. No personal token needed.
permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate app icon
        run: |
          node scripts/make-icon.js
          npm i png-to-ico@2 --no-save
          node scripts/png-to-ico.js

      - name: Build and publish to GitHub Releases
        env:
          # electron-builder reads this to upload the release. Provided automatically.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows code signing (OPTIONAL). electron-builder signs the installer
          # automatically when these are present, and builds UNSIGNED (no failure)
          # when they're absent. Add them as repository Secrets to enable signing —
          # see docs/SIGNING.md.
          #   WIN_CSC_LINK         = base64 of your code-signing .pfx (or a path/URL to it)
          #   WIN_CSC_KEY_PASSWORD = the .pfx password
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run release

# To also build macOS/Linux, add jobs on `macos-latest` / `ubuntu-latest`.
# Note: macOS auto-update requires an Apple Developer account to sign & notarize.
